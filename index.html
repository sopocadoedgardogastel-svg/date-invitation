<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invitation ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffd6e8,#ffeecf);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    max-width:500px;
    width:90%;
}

h1{
    color:#ff4f81;
}

button{
    padding:12px 24px;
    margin:10px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.yes{
    background:#ff4f81;
    color:white;
}

.no{
    background:#ddd;
    color:black;
    position:relative;
}

.sticker{
    font-size:90px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}
</style>
</head>

<body>

<div class="card" id="page1">
    <h1>❤️ Hey You ❤️</h1>
    <p>Would you like to go on a little walk with me tonight? 🌙✨</p>

    <button class="yes" onclick="showChocolate()">Yes 😍</button>
    <button class="no" id="noBtn1">No 😅</button>
</div>

<div class="card" id="page2" style="display:none;">
    <h1>🍫 One More Question!</h1>
    <p>Would you like some chocolate too? 😋</p>

    <button class="yes" onclick="showFinal()">Yes 🍫</button>
    <button class="no" id="noBtn2">No 🙈</button>
</div>

<div class="card" id="page3" style="display:none;">
    <div class="sticker">🥰</div>
    <h1>You Made Me Happy! 💖</h1>
    <p>Yay! It's a date. See you tonight for our walk and chocolate! 🌙🍫❤️</p>
</div>

<script>

function moveButton(btn){
    const x = Math.random()*250 - 125;
    const y = Math.random()*150 - 75;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

document.getElementById("noBtn1").addEventListener("mouseover", function(){
    moveButton(this);
});

document.getElementById("noBtn2").addEventListener("mouseover", function(){
    moveButton(this);
});

document.getElementById("noBtn1").addEventListener("click", function(){
    moveButton(this);
});

document.getElementById("noBtn2").addEventListener("click", function(){
    moveButton(this);
});

function showChocolate(){
    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";
}

function showFinal(){
    document.getElementById("page2").style.display="none";
    document.getElementById("page3").style.display="block";
}
</script>

</body>
</html>
